name: Build and deploy Python app to Azure Web App - CrunchWeek

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: azure-crunchweek-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: CrunchWeek
  AZURE_RESOURCE_GROUP: Crunchweek

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Python code
        run: |
          pip install -r requirements-dev.txt
          python -m ruff check crunch_week tests scripts
          python -m pytest

      - name: Verify and build React
        working-directory: frontend
        run: npm ci && npm test && npm run build

      - name: Package complete application
        run: python scripts/package_deployment.py

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deployment.zip
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C30635A979204EEF9EEE7B937B190EA1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C9C8D96AB3FF423BBAD072AE8297814E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6C8CD14CBD1D4B36BE15C6B586DC18EB }}

      - name: Check app and configure FastAPI startup
        id: app
        shell: bash
        run: |
          set -euo pipefail
          az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query '{state:state,host:defaultHostName}' --output json
          az webapp config show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query '{runtime:linuxFxVersion,startup:appCommandLine}' --output json
          az webapp config set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --startup-file 'bash azure-startup.sh' --output none
          az webapp config appsettings set --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true --output none
          az webapp config appsettings delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --setting-names WEBSITE_RUN_FROM_PACKAGE --output none
          app_host=$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEBAPP_NAME" --query defaultHostName --output tsv)
          echo "url=https://$app_host" >> "$GITHUB_OUTPUT"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'CrunchWeek'
          slot-name: 'Production'
          package: deployment.zip

      - name: Verify live API and React app
        env:
          DEPLOYED_APP_URL: ${{ steps.app.outputs.url }}
        run: python scripts/verify_deployment.py "$DEPLOYED_APP_URL"
